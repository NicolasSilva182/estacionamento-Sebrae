<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
<title>Saida</title>
</head>
<body>

<label for="placa">Selecionar Placa:</label>

<select id="placa" onchange="selecionarVeiculo(this.value)">
    <option value="">Selecione a placa</option>

    <option th:each="v : ${veiculos}"
            th:value="${v.id}"
            th:text="${v.placa}"
            th:selected="${veiculo != null && veiculo.id == v.id}">
    </option>
</select>
<div th:if="${veiculo != null}">
    <strong>Veículo:</strong>
    <span th:text="${veiculo.modelo + ' ' + veiculo.cor}"></span>
</div>

<script>
    function selecionarVeiculo(id) {
        if (id) {
            window.location.href = "/veiculos/saida/" + id;
        } else {
            window.location.href = "/veiculos/saida";
        }
    }
</script>
</body>
</html>
